name: Wheels

# Binary wheels (manylinux_2_28 x86_64, win_amd64; CPython 3.10-3.13) and an sdist.
# cibuildwheel is configured in pyproject.toml ([tool.cibuildwheel]); every wheel is tested
# with the pytest suite before it is uploaded as an artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - pyproject.toml
      - CMakeLists.txt
      - .github/workflows/wheels.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v3.2.1
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --outdir dist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Publishing is intentionally disabled. To enable it, configure a PyPI "trusted publisher"
  # for this repository/workflow (environment "pypi"), then uncomment the job below. No API
  # token secrets are needed with trusted publishing.
