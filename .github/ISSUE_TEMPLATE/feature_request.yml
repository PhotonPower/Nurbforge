name: Feature request
description: Propose a new geometric operation or integration
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Which scientific workflow needs this (optics, FEM, BEM, FMM, ...)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch the Python and/or C++ call.
  - type: textarea
    id: references
    attributes:
      label: References
      description: Algorithms, papers, NURBS Book sections.
