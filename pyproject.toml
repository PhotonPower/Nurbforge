[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "nurbforge"
version = "0.1.0"
description = "Headless NURBS-based CAD kernel for scientific software (optics, FEM, BEM, FMM)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "PhotonPower" }]
dependencies = ["numpy>=1.24"]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
mesh = ["gmsh>=4.11"]
llm  = []            # Ollama is accessed via plain HTTP (stdlib only)
dev  = ["pytest>=7", "gmsh>=4.11", "ruff", "mypy"]
docs = ["sphinx>=7", "furo", "myst-parser>=3", "breathe>=4.35"]

[project.scripts]
nurbforge-llm = "nurbforge.llm.cli:main"

[project.urls]
Homepage = "https://github.com/PhotonPower/Nurbforge"
Issues   = "https://github.com/PhotonPower/Nurbforge/issues"

[tool.scikit-build]
cmake.version = ">=3.24"
cmake.build-type = "Release"
wheel.packages = ["python/nurbforge"]
cmake.define = { NF_BUILD_TESTS = "OFF", NF_BUILD_EXAMPLES = "OFF", NF_BUILD_PYTHON = "ON" }

# Visual Studio 2026 needs CMake >= 4.2; older CMake silently falls back to NMake and fails.
# scikit-build-core downloads a suitable CMake from PyPI if the system one is too old.
[[tool.scikit-build.overrides]]
if.platform-system = "win32"
cmake.version = ">=4.2"

# Binary wheels (.github/workflows/wheels.yml). manylinux_2_28 (glibc 2.28) wheels install on
# AlmaLinux/RHEL 8, 9 and 10; Windows wheels need CMake >= 4.2 only for VS 2026 (override above).
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-win32 *_i686"
build-frontend = "build"
manylinux-x86_64-image = "manylinux_2_28"
# gmsh is only a test dependency; the mesh tests skip if it cannot be imported/loaded
# (e.g. missing OpenGL libraries inside the manylinux container).
test-requires = ["pytest>=7", "gmsh>=4.11"]
test-command = "pytest {project}/tests/python -v"

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py310"
